name: Test Action

on:
  push:
    branches: [main, cursor/**]
  pull_request:
  workflow_dispatch:

jobs:
  test-validate:
    name: Test Validate Command
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create test structure file
        run: |
          cat > .structkit.yaml << 'EOF'
          files:
            - test-file.txt:
                content: "Hello from StructKit!"
          EOF

      - name: Run validate
        uses: ./
        with:
          command: validate
          struct_file: .structkit.yaml

  test-generate-dry-run:
    name: Test Generate Dry Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create test structure file
        run: |
          cat > .structkit.yaml << 'EOF'
          files:
            - test-output/sample.txt:
                content: "Generated by StructKit Action!"
          EOF

      - name: Run generate (dry-run)
        id: generate
        uses: ./
        with:
          command: generate
          struct_file: .structkit.yaml
          dry_run: true

      - name: Check outputs
        run: |
          echo "Success: ${{ steps.generate.outputs.success }}"
          echo "Has changes: ${{ steps.generate.outputs.has_changes }}"
          echo "Exit code: ${{ steps.generate.outputs.exit_code }}"

  test-generate-real:
    name: Test Generate (Real)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create test structure file
        run: |
          cat > .structkit.yaml << 'EOF'
          files:
            - generated/test.txt:
                content: "This file was generated!"
            - generated/nested/file.txt:
                content: "Nested file content"
          EOF

      - name: Run generate
        uses: ./
        with:
          command: generate
          struct_file: .structkit.yaml
          output_dir: .

      - name: Verify generated files
        run: |
          test -f generated/test.txt || (echo "File not created!" && exit 1)
          test -f generated/nested/file.txt || (echo "Nested file not created!" && exit 1)
          echo "Generated files verified successfully!"

  test-custom-version:
    name: Test Custom StructKit Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create test structure file
        run: |
          cat > .structkit.yaml << 'EOF'
          files:
            - version-test.txt:
                content: "Testing version"
          EOF

      - name: Run with git installation
        uses: ./
        with:
          command: validate
          struct_file: .structkit.yaml
          structkit_version: "https://github.com/httpdss/structkit.git@main"

  test-validate-structkit-yaml-fixture:
    name: Test Validate .structkit.yaml Fixture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run validate with .structkit.yaml fixture
        uses: ./
        with:
          command: validate
          struct_file: tests/fixtures/structkit-yaml/.structkit.yaml

  test-validate-legacy-struct-yaml-fixture:
    name: Test Validate Legacy .struct.yaml Fixture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run validate with legacy .struct.yaml fixture
        uses: ./
        with:
          command: validate
          struct_file: tests/fixtures/legacy-struct-yaml/.struct.yaml

  test-auto-detect-structkit-yaml:
    name: Test Auto-detect .structkit.yaml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Place .structkit.yaml at repo root
        run: cp tests/fixtures/structkit-yaml/.structkit.yaml .structkit.yaml

      - name: Run validate without struct_file
        uses: ./
        with:
          command: validate

  test-auto-detect-legacy-struct-yaml:
    name: Test Auto-detect Legacy .struct.yaml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Place legacy .struct.yaml at repo root
        run: cp tests/fixtures/legacy-struct-yaml/.struct.yaml .struct.yaml

      - name: Run validate without struct_file
        uses: ./
        with:
          command: validate

  test-auto-detect-prefers-structkit-yaml:
    name: Test Auto-detect Prefers .structkit.yaml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Place both default files at repo root
        run: |
          cp tests/fixtures/structkit-yaml/.structkit.yaml .structkit.yaml
          cp tests/fixtures/legacy-struct-yaml/.struct.yaml .struct.yaml

      - name: Run validate without struct_file
        uses: ./
        with:
          command: validate

  test-auto-detect-missing:
    name: Test Auto-detect Missing Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run validate without config
        id: validate
        continue-on-error: true
        uses: ./
        with:
          command: validate

      - name: Expect failure
        run: |
          if [[ "${{ steps.validate.outcome }}" != "failure" ]]; then
            echo "Expected auto-detect to fail when neither .structkit.yaml nor .struct.yaml exists"
            exit 1
          fi
          echo "Missing config failed as expected"
