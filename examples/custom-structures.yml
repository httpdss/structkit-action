name: Generate with Custom Structures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.structkit.yaml'
      - '.struct.yaml'

jobs:
  generate-with-custom:
    name: Generate Using Custom Structures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up StructKit
        uses: httpdss/structkit-setup@v0

      - name: Generate with custom structures
        uses: httpdss/structkit-action@v0
        with:
          command: generate
          struct_file: .structkit.yaml
          structures_repository: myorg/my-custom-structures
          structures_repository_path: templates
          structures_repository_ref: v1.0.0

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "chore: regenerate structure with custom templates"
            git push
          else
            echo "No changes to commit"
          fi
